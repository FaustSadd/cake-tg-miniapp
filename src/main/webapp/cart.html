<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Ваша корзина</h1>
<div id="toast-container" class="toast-container"></div>

<!-- Контейнер для отображения товаров в корзине -->
<div id="cart-items-container"></div>

<!-- Общая стоимость -->
<p id="total-price">Итого: ₽ 0</p>

<!-- Кнопка очистки корзины -->
<button id="clearCartButton">Очистить корзину</button>

<!-- Кнопка перехода к оформлению заказа (Checkout) -->
<button id="checkout-button">Оформить заказ</button>

<script src="cart.js"></script>
</body>
</html>
